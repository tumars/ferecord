<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="ferecord 产品介绍网站。">
    <meta name="robots" content="noindex, nofollow">
    <title>ferecord · 产品与探索</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; color: #24352d; background: #f5f4ef; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      .page { max-width: 1100px; min-height: 100svh; margin: auto; padding: 32px clamp(24px, 6vw, 72px); display: flex; flex-direction: column; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 20px; border-bottom: 1px solid #d7dbd3; padding-bottom: 24px; }
      .brand { font-size: 24px; font-weight: 700; letter-spacing: -.8px; }
      .status { font-size: 13px; color: #58695e; }
      .blog-link { color: #365b45; text-underline-offset: 4px; }
      main { flex: 1; padding: clamp(72px, 14vh, 150px) 0 80px; }
      .eyebrow { color: #62725e; font-size: 12px; letter-spacing: 3px; }
      h1 { font-size: clamp(40px, 8vw, 80px); line-height: 1.15; letter-spacing: -2px; font-weight: 600; margin: 28px 0; }
      .intro { max-width: 34em; color: #58695e; font-size: 17px; line-height: 1.9; }
      .note { margin-top: 64px; border-left: 2px solid #9aa98d; padding-left: 20px; max-width: 36em; }
      .note h2 { font-size: 18px; font-weight: 500; }
      .note p { color: #58695e; line-height: 1.8; font-size: 14px; }
      footer { border-top: 1px solid #d7dbd3; padding-top: 24px; font-size: 13px; color: #58695e; }
    </style>
  </head>
  <body>
    <div class="page">
      <header><span class="brand">ferecord</span><a class="blog-link" href="https://blog.ferecord.com">博客 ↗</a></header>
      <main>
        <p class="eyebrow">PRODUCTS & EXPLORATIONS</p>
        <h1>每一个想法，<br>都有自己的空间。</h1>
        <p class="intro">这里将展示 ferecord 的产品与探索。产品介绍正在准备中，稍后见。</p>
        <section class="note" aria-labelledby="products">
          <h2 id="products">产品</h2>
          <p><a href="https://tibi.ferecord.com">Tibi 缇比</a> — 读你感兴趣的英文文章，顺便把英语学会。本地优先 · AI 原生 · 开源。</p>
        </section>
      </main>
      <footer>
        <span>ferecord</span>
        <!-- 正式上线前填写真实 ICP 备案号及链接，并移除 head 中的 noindex。 -->
      </footer>
    </div>
  </body>
</html>
