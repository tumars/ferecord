<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>画海 · 在画作之间，读懂西方艺术。</title>
  <meta name="description" content="画海：在画作之间，读懂西方艺术。从史前洞窟到二十世纪，自由探索作品、人物与时代。">
  <meta name="theme-color" content="#0E1118">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F35A8'/%3E%3Cpath d='M9 25V12a7 7 0 0 1 14 0v13' fill='none' stroke='%23D9B66A' stroke-width='2.4'/%3E%3Cpath d='M13 25v-9a3 3 0 0 1 6 0v9' fill='none' stroke='%23F3EEDF' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap">
  <script>
    // 尽早应用用户选过的主题，避免闪烁
    try { var t = localStorage.getItem("aha.theme"); if (t === '"light"' || t === '"dark"') document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
    // 手机进入独立页层（判断与 main.ts 一致）：先隐藏桌面骨架，只显示启动画面
    if (document.documentElement.classList.contains("native") || matchMedia("(max-width: 700px)").matches || (matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) <= 700)) {
      var root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      root.classList.add("m-boot");
      document.querySelector('meta[name="theme-color"]').content = dark ? "#0b1520" : "#dcd7cd";
    }
  </script>
  <style>
    /* 手机启动画面：与画海的底色一致（浅色是展厅墙，深色是夜空），一件金框小画、站名与一条金色进度线 */
    .boot-splash { display: none; }
    html.m-boot body { margin: 0; background: #dcd7cd; }
    html.m-boot body > :not(.boot-splash):not(#mobile-app) { display: none !important; }
    html.m-boot .boot-splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-content: center; justify-items: center; gap: 12px; background: #dcd7cd; color: #23211d; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; transition: opacity .5s ease, visibility 0s .5s; }
    .boot-splash .bs-frame { width: 54px; height: 70px; padding: 3px; margin-bottom: 10px; border-radius: 2px; background: #e8d7ad; box-shadow: inset 0 0 0 1px rgba(170, 132, 62, .6), 0 14px 26px -16px rgba(60, 48, 30, .55); animation: bs-float 3.2s ease-in-out infinite alternate; }
    .boot-splash .bs-frame i { display: block; height: 100%; border-radius: 1px; background: linear-gradient(115deg, #cfc6b4 30%, #e3dccd 50%, #cfc6b4 70%) 0 0 / 300% 100%; animation: bs-light 2.4s ease-in-out infinite; }
    .boot-splash b { font-family: "Songti SC", "Noto Serif SC", "STSong", serif; font-size: 30px; font-weight: 600; letter-spacing: .16em; text-indent: .16em; }
    .boot-splash span { font-size: 12.5px; letter-spacing: .08em; opacity: .58; }
    .boot-splash em { position: relative; width: 64px; height: 1.5px; margin-top: 14px; border-radius: 1px; overflow: hidden; background: rgba(170, 132, 62, .22); }
    .boot-splash em::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 40%; border-radius: 1px; background: #a8873f; animation: bs-bar 1.3s ease-in-out infinite; }
    .boot-splash.done { opacity: 0; visibility: hidden; }
    .boot-splash.failed em { display: none; }
    @keyframes bs-float { to { transform: translateY(-5px) rotate(-1.5deg); } }
    @keyframes bs-light { from { background-position: 100% 0; } to { background-position: 0 0; } }
    @keyframes bs-bar { to { left: 100%; } }
    @media (prefers-color-scheme: dark) {
      html.m-boot:not([data-theme="light"]) body, html.m-boot:not([data-theme="light"]) .boot-splash { background: #0b1520; color: #eef1f4; }
      html:not([data-theme="light"]) .boot-splash .bs-frame { background: #1e1b17; box-shadow: inset 0 0 0 1px rgba(224, 195, 140, .5), 0 16px 22px -12px rgba(236, 166, 72, .35); }
      html:not([data-theme="light"]) .boot-splash .bs-frame i { background-image: linear-gradient(115deg, #1d2833 30%, #2c3a47 50%, #1d2833 70%); }
      html:not([data-theme="light"]) .boot-splash em { background: rgba(217, 182, 106, .2); }
      html:not([data-theme="light"]) .boot-splash em::after { background: #d9b66a; }
    }
    html.m-boot[data-theme="dark"] body, html.m-boot[data-theme="dark"] .boot-splash { background: #0b1520; color: #eef1f4; }
    html[data-theme="dark"] .boot-splash .bs-frame { background: #1e1b17; box-shadow: inset 0 0 0 1px rgba(224, 195, 140, .5), 0 16px 22px -12px rgba(236, 166, 72, .35); }
    html[data-theme="dark"] .boot-splash .bs-frame i { background-image: linear-gradient(115deg, #1d2833 30%, #2c3a47 50%, #1d2833 70%); }
    html[data-theme="dark"] .boot-splash em { background: rgba(217, 182, 106, .2); }
    html[data-theme="dark"] .boot-splash em::after { background: #d9b66a; }
    @media (prefers-reduced-motion: reduce) { .boot-splash *, .boot-splash *::after { animation: none !important; } }
    /* iOS App：原生启动画面只有底色（与第一屏一致，不放文字和品牌），网页启动画面也只留底色接上它 */
    html.native .boot-splash > * { display: none !important; }
    html.native .boot-splash.failed > span { display: block !important; }
  </style>
  <script type="module" crossorigin src="/art-history-atlas/assets/index-CDsx6Lkf.js"></script>
  <link rel="stylesheet" crossorigin href="/art-history-atlas/assets/index-BokYIdXu.css">
</head>
<body>
<div class="boot-splash" role="status" aria-label="正在打开画海"><div class="bs-frame"><i></i></div><b>画海</b><span>在画作之间，读懂西方艺术</span><em></em></div>
<a class="skip" href="#chronology">跳到正文</a>

<header class="topbar" id="topbar">
  <div class="topbar-in">
    <a class="mark" href="#top" aria-label="回到顶部"><span class="mark-zh" id="mark-zh"></span><span class="mark-en" id="mark-en"></span></a>
    <nav class="index" id="index" aria-label="分区"></nav>
    <div class="tools">
      <select class="trad-switch" id="trad-switch" aria-label="切换艺术史体系" hidden></select>
      <button class="search-open" id="search-open" aria-haspopup="dialog" aria-controls="search-dialog">搜索</button>
      <button class="menu-open mobile-only" id="menu-open" aria-haspopup="dialog" aria-controls="site-menu">目录</button>
      <button class="icon-btn" id="theme-btn" aria-label="切换主题"></button>
      <a class="icon-btn" id="repo-link" target="_blank" rel="noopener" aria-label="在 GitHub 上查看源码">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </div>
  <div class="progress" id="progress"></div>
</header>

<main id="top">
  <!-- 序厅：浮空画海 -->
  <section class="hero" id="hero" aria-label="序厅：浮空画海">
    <div class="hero-stars" id="hero-stars" aria-hidden="true"></div>
    <div class="hero-stage" id="hero-stage" tabindex="0" role="group" aria-label="画海作品"></div>
    <div class="hero-copy">
      <p class="kicker" id="hero-kicker"></p>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-lead" id="hero-lead"></p>
    </div>
    <div class="hero-now" aria-live="polite">
      <span class="now-year" id="now-year"></span>
      <span class="now-work" id="now-work"></span>
      <span class="now-period" id="now-period"></span>
    </div>
    <div class="hero-depth" role="group" aria-label="画海视距">
      <span class="sky-total" id="sky-total"></span>
      <button class="ctrl" id="sky-farther" aria-label="拉远视距">−</button>
      <span class="sky-depth-value" id="sky-depth-value">1.0×</span>
      <button class="ctrl" id="sky-nearer" aria-label="拉近视距">+</button>
    </div>
    <div class="hero-controls">
      <button class="ctrl" id="sky-prev" aria-label="上一件悬浮作品">←</button>
      <button class="ctrl" id="sky-play" aria-label="暂停漂浮" aria-pressed="false">Ⅱ</button>
      <button class="ctrl" id="sky-next" aria-label="下一件悬浮作品">→</button>
    </div>
    <nav class="hero-periods" id="hero-periods" aria-label="按时期浏览悬浮作品"></nav>
    <div class="hero-mobile-footer mobile-only"><div class="hero-mobile-links"><span>横拖探索 · 点作品看大图</span><button id="hero-options-open" aria-haspopup="dialog">画海选项</button></div><a class="hero-enter" href="#hall">进入十八间展厅 ↓</a></div>
  </section>

  <div class="wrap">
    <section class="block" id="chronology">
      <header class="block-head" data-section="chronology">
        <div class="block-tools">
          <div class="seg" role="group" aria-label="时间比例">
            <button id="tl-exp" aria-pressed="true">展开比例</button>
            <button id="tl-real" aria-pressed="false">真实比例</button>
          </div>
        </div>
      </header>
      <div class="panel">
        <div class="dg-wrap"><svg class="dg" id="tl-svg" role="img" aria-label="年表：背景历史、历史大事、代表作品与艺术时期"></svg></div>
        <div class="ev-card band-note" id="band-note" hidden aria-live="polite"></div>
        <div class="ev-nav"><button class="btn" id="ev-prev">← 上一件</button><button class="btn" id="ev-next">下一件 →</button><span id="ev-count"></span></div>
        <div class="ev-card" id="ev-card" aria-live="polite" hidden></div>
        <p class="tl-note" id="tl-note"></p>
        <div class="relay-wrap">
          <div class="label-sm">艺术中心的接力</div>
          <div class="relay" id="relay"></div>
        </div>
      </div>
    </section>

    <section class="block" id="hall">
      <header class="block-head" data-section="hall">
      </header>
      <nav class="era-nav" aria-label="展厅索引"><ol id="era-nav"></ol></nav>
      <div class="hall-body" id="hall-body">
        <div id="hall-readings" class="hall-readings"></div>
        <div class="hall">
          <div class="intro" id="intro"></div>
          <div class="feature" id="feature"></div>
        </div>
        <div class="diagram panel" id="diagram"></div>
        <div class="bridge-row">
          <p class="bridge" id="bridge"></p>
          <div class="nav-btns"><button class="btn" id="prev">← 上一间</button><button class="btn" id="next">下一间 →</button></div>
        </div>
      </div>
    </section>

    <section class="block" id="people">
      <header class="block-head" data-section="people">
        <div class="block-tools">
          <div class="seg" role="group" aria-label="视图">
            <button id="pv-schools" aria-pressed="true">艺术派系</button>
            <button id="pv-life" aria-pressed="false">生命线</button>
            <button id="pv-graph" aria-pressed="false">关系图</button>
          </div>
        </div>
      </header>
      <div class="panel">
        <div class="pv" id="pv-schools-box"></div>
        <div class="pv" id="pv-life-box" hidden>
          <div class="dg-wrap"><svg class="dg life" id="life-svg" role="img" aria-label="人物生命线：每人一条线，从出生到去世"></svg></div>
          <p class="tl-note" id="life-note" aria-live="polite"></p>
        </div>
        <div class="pv" id="pv-graph-box" hidden>
          <div class="graph-filters">
            <label>艺术派系<select id="graph-school" aria-label="关系图艺术派系"></select></label>
            <label class="graph-outside"><input type="checkbox" id="graph-outside">显示跨派系关系</label>
          </div>
          <div class="graph-context" id="graph-context" aria-live="polite"></div>
          <div class="graph-legend" id="graph-legend" role="group" aria-label="显示哪些关系"></div>
          <div class="dg-wrap"><svg class="dg graph" id="graph-svg" role="group" aria-label="人物关系图：师承、影响、对手、赞助与相遇"></svg></div>
        </div>
        <div class="who-card" id="who-card" aria-live="polite"></div>
      </div>
    </section>

    <section class="block" id="pendulum">
      <header class="block-head" data-section="pendulum"></header>
      <div class="panel"><div class="chart-scroll"><svg class="dg" id="pend" viewBox="0 0 900 250" role="img" aria-label="各时期风格倾向的摆动"></svg></div><p class="tl-note" id="pend-note"></p></div>
    </section>

    <section class="block" id="pairs">
      <header class="block-head" data-section="pairs"></header>
      <div class="pair-tabs" id="pair-tabs" role="group" aria-label="选择一组作品"></div>
      <div class="panel" id="pair-body"></div>
    </section>

    <section class="block" id="readings">
      <header class="block-head" data-section="readings"></header>
      <div id="reading-shelf" class="reading-shelf"></div>
      <article id="reading" class="reading" hidden aria-label="看画故事"></article>
    </section>

    <section class="block" id="sizes">
      <header class="block-head" data-section="sizes"></header>
      <div class="panel">
        <div class="size-chips" id="size-chips"></div>
        <div class="dg-wrap"><svg class="dg" id="size-svg" viewBox="0 0 620 330" role="img" aria-label="作品尺寸与人体比例对比"></svg></div>
      </div>
    </section>

    <section class="block" id="collection">
      <header class="block-head" data-section="collection"></header>
      <div class="lt">
        <div class="lt-view" id="lt-view" aria-live="polite"></div>
        <div class="lt-map" id="lt-map" role="group" aria-label="跳到某个时期"></div>
        <div class="lt-reel" id="lt-reel" role="group" aria-label="全部作品，按时期排列"></div>
      </div>
    </section>
  </div>
</main>

<footer class="site-foot" id="footer"></footer>

<dialog class="lightbox" id="lightbox" hidden aria-label="作品大图">
  <div class="lb-stage" id="lb-stage">
    <img id="lb-img" alt="">
    <div class="lb-none" id="lb-none" hidden></div>
  </div>
  <aside class="lb-side">
    <div class="lb-cap" id="lb-cap"></div>
    <div class="lb-actions">
      <button class="btn btn-dark" id="lb-prev" aria-label="上一件">←</button>
      <span class="lb-count" id="lb-count"></span>
      <button class="btn btn-dark" id="lb-next" aria-label="下一件">→</button>
      <button class="btn btn-dark" id="lb-go">去这个展厅</button>
    </div>
  </aside>
  <div class="lb-toolbar"><button class="lb-close" id="lb-close" aria-label="返回上一处">← 返回</button><button class="btn btn-dark" id="lb-zoom" aria-pressed="false">放大</button></div>
</dialog>

</body>
</html>
