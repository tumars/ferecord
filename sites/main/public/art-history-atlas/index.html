        <div class="who-card" id="who-card" aria-live="polite"></div>
      </div>
    </section>

    <section class="block" id="pendulum">
      <header class="block-head" data-section="pendulum"></header>
      <div class="panel"><div class="chart-scroll"><svg class="dg" id="pend" viewBox="0 0 900 250" role="img" aria-label="各时期风格倾向的摆动" data-i18n-label="各时期风格倾向的摆动"></svg></div></div>
    </section>

    <section class="block" id="readings">
      <header class="block-head" data-section="readings"></header>
      <div id="reading-shelf" class="reading-shelf"></div>
      <article id="reading" class="reading" hidden aria-label="导读" data-i18n-label="导读"></article>
    </section>

    <section class="block" id="sizes">
      <header class="block-head" data-section="sizes"></header>
      <div class="panel">
        <div class="size-chips" id="size-chips"></div>
        <div class="dg-wrap"><svg class="dg" id="size-svg" viewBox="0 0 620 330" role="img" aria-label="作品尺寸与人体比例对比" data-i18n-label="作品尺寸与人体比例对比"></svg></div>
      </div>
    </section>

    <section class="block" id="collection">
      <header class="block-head" data-section="collection"></header>
      <div class="lt">
        <div class="lt-view" id="lt-view" aria-live="polite"></div>
        <div class="lt-map" id="lt-map" role="group" aria-label="跳到某个时期" data-i18n-label="跳到某个时期"></div>
        <div class="lt-reel" id="lt-reel" role="group" aria-label="全部作品，按时期排列" data-i18n-label="全部作品，按时期排列"></div>
      </div>
    </section>
    <section class="block" id="places">
      <header class="block-head" data-section="places"></header>
      <div class="pl">
        <div class="pl-map" id="pl-map"></div>
        <div class="pl-side" id="pl-side" aria-live="polite"></div>
      </div>
      <div class="pl-all" id="pl-countries"></div>
    </section>
  </div>
</main>

<footer class="site-foot" id="footer"></footer>

<dialog class="lightbox" id="lightbox" hidden aria-label="作品" data-i18n-label="作品">
  <!-- 作品页：左边是一面被射灯照亮的墙（与手机版作品页同一套灯光），右边是展签、看点、资料与相关作品 -->
  <div class="lb-stage" id="lb-stage">
    <div class="lb-lights" aria-hidden="true"><i class="beam"></i><i class="spot"></i><i class="vig"></i></div>
    <img id="lb-img" alt="">
    <div class="lb-none" id="lb-none" hidden></div>
    <button class="lb-arrow prev" id="lb-prev" aria-label="上一件" data-i18n-label="上一件"></button>
    <button class="lb-arrow next" id="lb-next" aria-label="下一件" data-i18n-label="下一件"></button>
    <span class="lb-count" id="lb-count"></span>
  </div>
  <aside class="lb-side" id="lb-side">
    <div class="lb-cap" id="lb-cap"></div>
  </aside>
  <div class="lb-toolbar"><button class="lb-close" id="lb-close" aria-label="返回上一处" data-i18n-label="返回上一处"><span data-i18n="← 返回">← 返回</span></button><button class="lb-zoom" id="lb-zoom" aria-pressed="false" hidden><span data-i18n="放大">放大</span></button></div>
</dialog>

</body>
</html>
