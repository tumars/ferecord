<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="ferecord 产品站点占位页，正式介绍即将更新。">
    <meta name="robots" content="noindex, nofollow">
    <title>产品示例 · ferecord</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; color: #202b3b; background: #f1f3f7; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      .page { max-width: 1100px; min-height: 100svh; margin: auto; padding: 32px clamp(24px, 6vw, 72px); display: flex; flex-direction: column; }
      header { border-bottom: 1px solid #d5dbe4; padding-bottom: 24px; font-size: 20px; font-weight: 600; }
      header span { color: #66758a; font-size: 14px; font-weight: 400; margin-left: 12px; }
      main { flex: 1; padding: clamp(72px, 14vh, 150px) 0 80px; }
      .eyebrow { font-size: 12px; letter-spacing: 3px; color: #586b88; }
      h1 { font-size: clamp(40px, 8vw, 80px); line-height: 1.15; font-weight: 600; letter-spacing: -2px; margin: 28px 0; }
      .intro { max-width: 34em; font-size: 17px; line-height: 1.9; color: #56667c; }
      footer { border-top: 1px solid #d5dbe4; padding-top: 24px; color: #56667c; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="page">
      <header>ferecord<span>产品示例</span></header>
      <main>
        <p class="eyebrow">A NEW PRODUCT</p>
        <h1>新的产品，<br>正在准备中。</h1>
        <p class="intro">这是产品介绍页的占位示例。产品名称、核心功能与体验入口将在正式发布时更新。</p>
      </main>
      <footer>
        <span>来自 ferecord 的探索</span>
        <!-- 正式上线前填写真实 ICP 备案号及链接，并移除 head 中的 noindex。 -->
      </footer>
    </div>
  </body>
</html>
